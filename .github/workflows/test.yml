name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [backend, mini-app]
    env:
      TEST_FFMPEG_PATH: /usr/bin/ffmpeg
      TEST_PLAYWRIGHT_MODULE: ${{ github.workspace }}/mini-app/node_modules/playwright
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: |
          npm ci --prefix backend
          npm ci --prefix mini-app
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install Chromium and browser dependencies
        working-directory: mini-app
        run: npx --no-install playwright install --with-deps chromium
      - name: Check pull request whitespace
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --check "$BASE_SHA...HEAD"
      - name: Run complete test suite
        working-directory: ${{ matrix.suite }}
        run: node --test test/*.test.js
